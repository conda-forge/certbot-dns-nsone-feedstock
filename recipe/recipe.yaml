context:
  version: "5.10.0"

package:
  name: certbot-dns-nsone
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-nsone/certbot_dns_nsone-${{ version }}.tar.gz
  sha256: a36ee31bb0776cf279347ffed3ffe584072b590615e46aee7092db41af77e8ea

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - dns-lexicon >=3.14.1

tests:
  - python:
      imports:
        - certbot_dns_nsone
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: NS1 DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
